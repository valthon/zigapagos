# Dependabot version updates.
#
# Verified against the current GitHub docs on 2026-07-27 — re-check these before editing, because
# the schema has grown recently and a stale memory of it produces keys that silently do nothing:
#   options reference     https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#   supported ecosystems  https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
#   bun support (GA)      https://github.blog/changelog/2025-02-13-dependabot-version-updates-now-support-the-bun-package-manager-ga/
#   default cooldown      https://github.blog/changelog/2026-07-14-dependabot-version-updates-introduce-default-package-cooldown/
# `version: 2` is still the only accepted value; `groups`, `directories` and `cooldown` are all
# newer than it, so "the version says 2" is not evidence that a given key is old enough to exist.
#
# TWO SPELLINGS OF "update-types", AND THEY ARE NOT INTERCHANGEABLE. This is the same class of
# trap as the `dependency-type` note further down, so check which one you are writing:
#   - `groups.<name>.update-types`  takes BARE  `major` / `minor` / `patch`
#   - `ignore[].update-types`       takes       `version-update:semver-major` (and -minor/-patch)
# Both are documented in the options reference above. Writing an `ignore`-style value inside a
# group (or vice versa) does not fail validation loudly; it just matches nothing.
#
# COVERED
#   - GitHub Actions used by every workflow in .github/workflows/.
#   - runtime/ — the only first-party package with registry dependencies.
#
# DELIBERATELY NOT COVERED. Both are findings, not oversights:
#
#   - Zig, i.e. build.zig.zon and the dependencies it materializes. Dependabot has no Zig
#     ecosystem — Zig does not appear in the supported-ecosystems table at all, so there is no
#     identifier to write here and nothing to configure. The three .zon files (root,
#     site/, examples/tsx-site/) stay a manual job, done at the upstream release-tag syncs
#     described in CLAUDE.md. The zig-pkg/ trees they populate are gitignored vendored source,
#     which Dependabot could not see even if the ecosystem existed. Do not invent a `zig`
#     package-ecosystem value to close this gap; the config will simply be rejected.
#
#   - site/ and examples/tsx-site/. Both do have a package.json and a bun.lock, so they look
#     like they belong below, but every dependency either declares is a `file:` link —
#     `@z/runtime` into runtime/, `@demo/widget` into a vendored directory. There is no
#     registry version to bump, so an entry for them would schedule a scan that can never open
#     a PR. Add an entry here only if one of them grows a real registry dependency.
#
#     BUT their lockfiles are NOT self-maintaining, and an earlier revision of this comment was
#     wrong to imply they were ("resolved from runtime/package.json's ranges"). Each embeds its
#     OWN copy of @z/runtime's resolved dependency set, including a concrete `typescript`
#     version, and bun does not re-read runtime/package.json for a linked package on a plain
#     `bun install`. Measured during the 5.9 → 6.0 bump: after runtime/ moved to ^6.0.3 both
#     trees still installed typescript 5.9.3, and `bun install --frozen-lockfile` still exited
#     0 — so nothing failed loudly. That is the dangerous part: pages.yml builds site/, and
#     src/islands/props_check.zig resolves `tsc` from the WEBSITE root, so the props-check gate
#     would have kept running a different compiler from the one runtime/ was tested against.
#     Regenerating requires removing the lockfile (`rm bun.lock && bun install`); a plain
#     reinstall is not enough. So whenever a runtime/ devDependency that these trees resolve
#     through the link changes, refresh both lockfiles in the SAME commit.

version: 2

updates:
  # `directory: "/"` is this ecosystem's documented value and means "scan .github/workflows/",
  # not "scan the repository root" — so workflows added later are picked up without touching
  # this file. Dependabot only tracks steps written in GitHub repository syntax
  # (`owner/repo@ref`); a `uses:` pointing at a local path or a container image is invisible to
  # it, which is worth remembering before concluding an action is up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # One PR per week for all action bumps instead of one PR per action. Every `uses:` here
      # is pinned to a major tag (actions/checkout@v4, jdx/mise-action@v2, mlugg/setup-zig@v2),
      # so Dependabot fires only on a major release — precisely the bumps that can break the
      # toolchain contract in mise.toml, and precisely the ones worth reading in a single diff
      # rather than three separate PRs that each turn CI red on their own.
      #
      # DELIBERATELY NOT given the major/non-major split the bun entry below grew. The split
      # exists so a major cannot ride along hidden inside a PR of routine updates — but in this
      # ecosystem there ARE no routine updates for it to hide behind. Because every `uses:` is
      # pinned to a bare major tag, a major release is the ONLY thing Dependabot can ever
      # propose here; patch and minor releases move the tag in place and are invisible to it.
      # So the hazard does not exist, and applying the split anyway would be actively harmful:
      # a `update-types: ["minor", "patch"]` group would match nothing, and per the docs
      # unmatched updates "are updated in individual pull requests" — reintroducing exactly the
      # per-action PR spam this group was created to stop.
      #
      # Blanket-ignoring majors here would be worse still. The two most recent action bumps in
      # this repo were both majors — actions/checkout v4 → v7 and jdx/mise-action v2 → v4 — and
      # both were wanted: together they cleared a Node-20 runtime deprecation that would
      # otherwise have started failing workflows. An ignore rule would have silently withheld
      # them. Majors are the signal in this ecosystem, not the noise.
      actions:
        patterns:
          - "*"

  # runtime/ is the shipped @z/runtime package. Its bun.lock is the text format Dependabot
  # requires — it does not read the legacy binary bun.lockb — and mise.toml pins bun 1.3.14, above
  # the documented >=1.1.39 floor for this ecosystem. Note the docs also record that bun has
  # version updates but NOT security updates yet, so a Dependabot security alert on a package
  # here will not auto-open a fix PR; the weekly version bump is the only automation.
  - package-ecosystem: "bun"
    directory: "/runtime"
    schedule:
      interval: "weekly"
    cooldown:
      # Deliberately longer than the 3-day platform default that took effect 2026-07-14. These
      # resolve to npm-registry tarballs, and a compromised or yanked release is usually caught
      # within the first week; waiting costs nothing on a weekly schedule. The actions entry
      # above is left on the default on purpose — those resolve to git refs in GitHub-hosted
      # repositories, a different threat model. Security updates ignore cooldown entirely.
      default-days: 7
    ignore:
      # TypeScript is ON 6.x and capped BELOW 7.0. The cap has a specific expiry, not a freeze —
      # see the unblock condition at the end.
      #
      # 6.0 is the FINAL JavaScript-based TypeScript line. 7.0 is the Go rewrite, and its npm
      # package no longer ships the JavaScript compiler API at all. That is observable in the
      # package, not just the release notes: `typescript@7.0.2`'s `exports["."]` is
      # `./lib/version.cjs`, whose entire contents are the version string, so
      # `import ts from "typescript"` yields `{version, versionMajorMinor}` and nothing else,
      # and `ts.createSourceFile` / `ts.ScriptTarget` / `ts.ScriptKind` are all `undefined`.
      #   7.0 announcement  https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/
      #     — "TypeScript 7.0 does not ship with an API. We expect TypeScript 7.1 to ship with
      #        a new (and different) API".
      #   6.0 announcement  https://devblogs.microsoft.com/typescript/announcing-typescript-6-0/
      #
      # Two first-party modules parse TypeScript with that API, so 7.x breaks them outright:
      #   runtime/scripts/slice-host.ts    — the per-SPA host slicer, whose output is bundled
      #                                      into the shipped /spa/<name>-runtime.js
      #   runtime/sidecar/hot-transform.ts — the dev fast-refresh transform
      # Measured on typescript@7.0.2 in runtime/: `bun test` goes from 617 pass / 0 fail to
      # 566 pass / 51 fail, every failure a TypeError on `ts.ScriptTarget.Latest` or
      # `ts.ScriptKind.TSX`. That is what Dependabot PR #10 proposed and why it was rejected.
      # On 6.0.3 the same suite is 617 pass / 0 fail — the API is fully present, which is
      # precisely why 6.x is where this repo sits rather than back on 5.9.
      #
      # The CLI is NOT the blocker, so do not "fix" a future 7.x attempt by touching the tsc
      # gate: src/islands/props_check.zig shells out to `bun x tsc -p <cfg> --pretty false` and
      # parses `<path>(L,C): error TSxxxx: <msg>`. All three of 5.9.3, 6.0.3 and 7.0.2 emit that
      # line byte-identically (verified against one fixture). 5.9.3 and 6.0.3 also share the
      # exit code 2 on a type error; 7.0.2 alone returns 1, which the gate already tolerates
      # because it tests `tsc_exit != 0` rather than a literal. The blocker is only the JS API.
      #
      # WHY `versions: [">=7.0.0"]` AND NOT `update-types: ["version-update:semver-major"]`:
      # this rule is what MADE the 6.x upgrade reachable. Blocking every major would have
      # withheld 6.x too, and 6.x is the last line carrying the compiler API — the one major
      # here we positively wanted. The rule still admits 6.1, 6.2 and any 6.x patch, which now
      # arrive isolated in the runtime-majors group below. runtime/package.json's `^6.0.3`
      # encodes the same `<7.0.0` bound independently, so the manifest and this rule agree.
      #
      # UNBLOCK CONDITION — delete this entry when EITHER holds:
      #   1. a 7.x ships a usable programmatic API (7.1 at the earliest, per the announcement
      #      above; only `7.1.0-dev.*` nightlies exist so far) and the two modules are ported; or
      #   2. those two modules are re-platformed off the compiler API entirely. Note 7.0's
      #      `typescript/unstable/ast` subpath is NOT a drop-in: it exports ScriptKind,
      #      ScriptTarget, SyntaxKind and createScanner but has no `createSourceFile`, so there
      #      is still no whole-file parse entry point.
      # Staying on 6.x is what makes that future move cheap: 6.0 carries, as deprecations, every
      # option 7.0 removes outright, so the config surface is already 7.0-clean (see the
      # changelog fragment for the audit).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
    groups:
      # Split by blast radius rather than lumping the package into one PR. preact and
      # preact-render-to-string are SHIPPED to the browser via the import map — CLAUDE.md's
      # "bugs here reach every visitor's browser" — and a bump wants the parity harness and a
      # hydration check. In one combined PR the risky half hides behind the routine half.
      #
      # "Tooling" here means build-time, NOT low-stakes. typescript in particular reaches
      # further than the props-check gate and the test suite: slice-host.ts decides which host
      # members land in the shipped /spa/<name>-runtime.js, and hot-transform.ts rewrites dev
      # bundles. A TypeScript regression that under-includes a host member is a crash in a
      # shipped bundle, not a red test.
      #
      # Split by NAME, not by `dependency-type: production|development`, which is the obvious
      # way to write this and is wrong here: that key is gated to bundler, composer, mix,
      # maven, npm and pip, and `bun` is not on the list. It fails open rather than loudly —
      # the group would match nothing and, per the docs, "any outdated dependencies that do not
      # match a rule are updated in individual pull requests", i.e. it would silently produce
      # exactly the per-dependency PR spam the grouping exists to prevent. Note the JSON schema
      # accepts it, so schema validation does not catch this; only the prose does.
      #
      # Tooling is the enumerated side on purpose, so that anything NOT listed falls through to
      # the shipped group below. A dependency added later then defaults to "treat as shipped,
      # check the parity harness" — the safe direction to be wrong in.
      #
      # SECOND AXIS: both groups below are restricted to minor+patch, and every major is routed
      # into `runtime-majors`. Dependabot PR #10 is the motivation — it bundled a routine
      # happy-dom 20.10.6 → 20.11.0 together with typescript 5.9.3 → 7.0.2, a rewrite of the
      # compiler in another language that took out 51 tests. One PR, one CI result, and the
      # innocent half could not be merged without the half that broke the build. Isolating
      # majors makes a broken one cost only itself.
      #
      # `update-types` here takes the BARE spelling (`major`/`minor`/`patch`) — see the header.
      # Majors are deliberately NOT split by blast radius the way minor+patch are: the
      # tooling/shipped split exists so routine noise cannot camouflage a risky bump, and a
      # majors-only PR contains no routine noise to camouflage anything. Every entry in it is
      # read on its own merits regardless, so a fourth group would add config surface and no
      # signal.
      runtime-tooling:
        patterns:
          - "typescript"
          - "happy-dom"
          - "@happy-dom/*"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      runtime-shipped:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "happy-dom"
          - "@happy-dom/*"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      runtime-majors:
        patterns:
          - "*"
        update-types:
          - "major"
