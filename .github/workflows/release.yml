name: Release

# Runs in two modes, and the difference is exactly two jobs.
#
#   push of a v* tag   build every target, then PUBLISH the GitHub release, and —
#                      if and only if the repo variable NPM_PUBLISH_ENABLED is
#                      'true' — publish the npm packages built from those same
#                      archives.
#   pull_request /     build every target, assemble and INSTALL-TEST the npm
#   workflow_dispatch  packages, and stop. No release, no upload, no tag, no
#                      write permission.
#
# The smoke mode exists because the publish path used to be reachable only by
# pushing a tag: a typo in this file, a broken target, or a missing CHANGELOG
# section was first executed for real during a release, on a tag that cannot be
# un-pushed. The `paths` filter keeps that cost off unrelated PRs — only changes
# to the release plumbing itself pay for it — and `workflow_dispatch` gives the
# same dry run on demand from any branch once this is on main.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'build/release.zig'
      - 'build.zig.zon'
      - 'scripts/assert-version.sh'
      - 'scripts/extract-release-notes.sh'
      # The npm packages are cut from this workflow's own archives, so a change to
      # either side belongs on the same smoke path. tests/npm/ is here rather than
      # only in ci.yml because the version of it that matters runs against the real
      # ReleaseFast binary, which only exists on this workflow.
      - 'npm/**'
      - 'tests/npm/**'
  workflow_dispatch:

# Read-only by default; only the publishing job elevates.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A superseded smoke run is worth cancelling; a real release in flight is not.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    # One runner per target. This used to be a single ubuntu job cross-compiling
    # the whole matrix, which is fine for Zig itself but has three costs: a
    # macOS-only breakage cannot be distinguished from a Linux one in the log,
    # the targets are serialised, and any target that needs a native host to
    # build at all is unreachable by construction. Splitting them makes the
    # runner a per-target property and lets every archive be built and tested on
    # its native architecture.
    #
    # The target list itself lives in build/release.zig. A row here that names a
    # triple that list does not have fails at configure time with the valid
    # triples printed; a target added there without a row here would silently
    # stop being published, so add both together.
    strategy:
      # Report every broken target in one run rather than whichever failed first.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            runner: ubuntu-latest
            archive: x86_64-linux-musl.tar.xz
          - target: aarch64-linux-musl
            runner: ubuntu-24.04-arm
            archive: aarch64-linux-musl.tar.xz
          - target: x86_64-macos
            # macos-latest/15/26 are arm64. Keep x64 native on the last Intel
            # image (retiring around Aug 2027; actions/runner-images#13045), so
            # this validates the shipped binary rather than Rosetta.
            runner: macos-15-intel
            archive: x86_64-macos.zip
          - target: aarch64-macos
            runner: macos-latest
            archive: aarch64-macos.zip
    runs-on: ${{ matrix.runner }}
    steps:
      # fetch-depth: 0 is load-bearing, not caution. build/config.zig derives the
      # version from `git describe --match '*.*.*' --tags`, and build/release.zig
      # registers a *failing* `release` step unless that returns an exact tag. A
      # shallow checkout has no tags, so `release` would fail with
      # "git tag missing, cannot make release builds" on every run.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # build/release.zig also refuses to build when the tag disagrees with the
      # zon package version, and scripts/extract-release-notes.sh is what turns
      # CHANGELOG.md into the release body. Both are two seconds of bash, and
      # both are checked here — before the toolchain install and the ReleaseFast
      # build — so a version bump forgotten in build.zig.zon or a missing
      # changelog section fails in ~10s instead of after every runner in the
      # matrix has built a binary that will never be published.
      - name: Check tag against build.zig.zon and CHANGELOG.md
        if: github.event_name == 'push'
        run: |
          scripts/assert-version.sh "$GITHUB_REF_NAME"
          scripts/extract-release-notes.sh --check "$GITHUB_REF_NAME"

      # A smoke run has no tag, so `zig build release` would fail its gate before
      # compiling anything. Synthesise the tag build/release.zig demands in the
      # ephemeral checkout: `-f` because the real v0.1.0 exists on the remote at
      # an older commit and fetch-depth:0 brought it along. Nothing pushes it —
      # this job has `contents: read` and never runs a git write against origin.
      - name: Synthesise the zon-matching tag (smoke run only)
        if: github.event_name != 'push'
        run: |
          git tag -f "v$(scripts/assert-version.sh --print)" HEAD
          git describe --match '*.*.*' --tags

      - name: Setup toolchain (zig + bun via mise)
        uses: jdx/mise-action@v4

      # Both translate-c pins normally resolve from Codeberg (one directly, one
      # through SuperMD), but Codeberg capability discovery has failed
      # persistently from GitHub-hosted runners (tracked in #121). The official
      # ziglang/translate-c GitHub archive contains the identical commits. Zig
      # caches by content hash, so warming those hashes lets the unchanged graph
      # resolve without contacting Codeberg.
      #
      # Remove only this step when #121 confirms Codeberg is reachable from
      # hosted runners again, or when neither resolved pin uses Codeberg. Pin
      # changes still fail closed, although when Codeberg is unavailable the
      # later fetch retry may report its general dependency-fetch diagnostic
      # before the resolved-graph check can name an obsolete warmed hash.
      - name: Warm translate-c cache from the official GitHub archive
        shell: bash
        run: |
          fetch_exact() {
            local url="$1"
            local expected="$2"
            local actual=""
            local attempt
            for attempt in 1 2 3; do
              if actual="$(zig fetch "$url")" && [ "$actual" = "$expected" ]; then
                return 0
              fi
              if [ -n "${actual:-}" ] && [ "$actual" != "$expected" ]; then
                echo "::error::translate-c content hash mismatch: expected $expected, got $actual"
                return 1
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::failed to fetch $expected after ${attempt} attempts"
                return 1
              fi
              sleep $((attempt * 10))
            done
          }

          derive_pin() {
            node - "$1" "$2" <<'NODE'
          const [file, dependency] = process.argv.slice(2);
          const src = require("node:fs").readFileSync(file, "utf8");
          const escaped = dependency.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const block = src.match(new RegExp(`\\.${escaped}\\s*=\\s*\\.\\{([\\s\\S]*?)\\n\\s*\\},`));
          const url = block?.[1].match(/\.url\s*=\s*"([^"]+)"/)?.[1];
          const hash = block?.[1].match(/\.hash\s*=\s*"([^"]+)"/)?.[1];
          if (!url || !hash) throw new Error(`could not derive ${dependency} pin from ${file}`);
          process.stdout.write(`${url}\t${hash}`);
          NODE
          }

          root_pin="$(derive_pin build.zig.zon translate_c)"
          IFS=$'\t' read -r root_url root_hash <<< "$root_pin"
          root_mirror_url="${root_url/codeberg.org/github.com}"

          # SuperMD itself is hosted on GitHub, so resolve that exact root pin
          # first and read its translate_c dependency instead of copying it here.
          supermd_pin="$(derive_pin build.zig.zon supermd)"
          IFS=$'\t' read -r supermd_url supermd_hash <<< "$supermd_pin"
          fetch_exact "$supermd_url" "$supermd_hash"

          transitive_pin="$(derive_pin "zig-pkg/$supermd_hash/build.zig.zon" translate_c)"
          IFS=$'\t' read -r transitive_url transitive_hash <<< "$transitive_pin"
          transitive_mirror_url="${transitive_url/codeberg.org/github.com}"

          fetch_exact "$root_mirror_url" "$root_hash"
          fetch_exact "$transitive_mirror_url" "$transitive_hash"

          printf 'WARMED_TRANSLATE_C_HASHES=%s %s\n' "$root_hash" "$transitive_hash" >> "$GITHUB_ENV"

      - name: Fetch dependencies
        shell: bash
        run: |
          # Retry only dependency resolution. Compilation below runs once, so a
          # deterministic source error fails immediately rather than rebuilding.
          for attempt in 1 2 3; do
            if zig build --fetch; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::dependency fetch failed after ${attempt} attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done

          # WARMED_TRANSLATE_C_HASHES is supplied only by the temporary mirror
          # step. If that step is removed under #121, dependency fetching and
          # retries remain intact and this loop naturally has nothing to check.
          for expected in ${WARMED_TRANSLATE_C_HASHES:-}; do
            found=0
            grep -qF ".hash = \"$expected\"" build.zig.zon && found=1
            if [ "$found" -eq 0 ]; then
              while IFS= read -r zon; do
                if grep -qF ".hash = \"$expected\"" "$zon"; then
                  found=1
                  break
                fi
              done < <(find zig-pkg -type f -name build.zig.zon)
            fi
            if [ "$found" -eq 0 ]; then
              echo "::error::warmed translate-c hash is absent from the resolved dependency graph: $expected"
              exit 1
            fi
          done

      - name: Build ${{ matrix.target }}
        run: zig build release -Drelease-target=${{ matrix.target }}

      # `-Drelease-target` selects exactly one row of the matrix in
      # build/release.zig, so exactly one archive must appear. Asserting the
      # count — not just the name — catches a filter that silently matched
      # nothing or, worse, everything: with `merge-multiple` downloads in the
      # publish job, a duplicate archive from two runners would overwrite rather
      # than conflict.
      #
      # Deliberately no `mapfile`/`find -printf` here: this step also runs on the
      # macOS runner, where bash is 3.2 (no `mapfile`) and find is BSD (no
      # `-printf`). A nullglob array is portable to both and, unlike a bare glob,
      # yields an empty array rather than the literal pattern when nothing
      # matches.
      - name: Verify exactly one archive was produced
        shell: bash
        run: |
          shopt -s nullglob
          archives=(zig-out/releases/*.zip zig-out/releases/*.tar.xz)
          printf 'archive: %s\n' "${archives[@]}"
          if [ "${#archives[@]}" -ne 1 ] || [ "$(basename "${archives[0]}")" != "${{ matrix.archive }}" ]; then
            echo "::error::expected exactly ${{ matrix.archive }}, got ${#archives[@]} archive(s)"
            exit 1
          fi

      - name: Upload ${{ matrix.archive }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: zig-out/releases/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  # --- the runtime asset ------------------------------------------------------
  # `runtime.tar.xz`: the @z/runtime tree with its node_modules vendored, which is
  # what install.sh unpacks alongside the binary. Without it a curl install has no
  # sidecar, no bundlers and no slicers, and cannot render an island — the
  # per-target archives carry the binary alone, deliberately (see
  # docs/runtime-dependencies.md).
  #
  # Its own job, not a step inside `build`: the payload is identical for every
  # target, so building it once is both cheaper and the only way to guarantee the
  # two platforms ship the same bytes. It needs bun (to resolve the dependencies)
  # and node (npm/stage-runtime.mjs owns which files go in), and neither is a
  # cross-compilation concern.
  #
  # Runs on EVERY trigger, including pull requests, for the same reason the npm
  # job does: a packing mistake discovered at tag time is a mistake discovered too
  # late.
  runtime-asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup toolchain (zig + bun via mise)
        uses: jdx/mise-action@v4

      - name: Pack the runtime asset
        run: bash scripts/pack-runtime.sh dist

      # NOT named `release-*`: the `build` matrix uses that prefix and both the npm
      # job and the publish job download `release-*` with `merge-multiple`. A
      # runtime asset that matched would land in the npm job's `--archives` input
      # depending only on which job finished first. `publish` downloads this one by
      # name, so what it checksums is deterministic.
      - name: Upload runtime.tar.xz
        uses: actions/upload-artifact@v7
        with:
          name: runtime-asset
          path: dist/runtime.tar.xz
          if-no-files-found: error
          retention-days: 1

  # --- npm distribution -------------------------------------------------------
  # Assemble the three npm packages from the archives `build` just produced, pack
  # them, and install-test them. Runs on EVERY trigger, including pull requests:
  # the whole point of this workflow's smoke mode is that a packaging mistake is
  # executed for real before a tag, and npm is worse than the GitHub release in
  # that respect — a published version cannot be replaced, only deprecated.
  #
  # It CONSUMES the archives rather than rebuilding. A rebuild from the same commit
  # is a second chance to be different, and it would double the release's compile
  # time for bytes that must be identical anyway.
  npm-package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # Before anything is packed: build/release.zig, npm/cli/targets.json and this
      # file's matrix must name the same targets. A stale targets.json publishes a
      # platform package whose binary nobody built — an install that resolves and
      # then cannot run. ci.yml runs the same gate on every PR through
      # tests/npm/targets.sh; here it guards the release itself.
      - name: Release target drift gate
        run: node npm/check-targets.mjs

      # And the dependency ranges @zigapagos/cli publishes: preact from
      # runtime/package.json, @zigbase/server from src/cli/zigbase.zig's
      # pinned_version, bun from mise.toml. A zigbase range that has drifted from
      # the pin ships a CLI whose `dev` installs one version over npm and
      # downloads another on a PATH miss. ci.yml runs the same gate on every PR
      # through tests/npm/toolchain.sh; here it guards the release itself.
      - name: Toolchain dependency drift gate
        run: node npm/check-toolchain.mjs

      - name: Download every target's archive
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # Generates the manifests, extracts one binary per platform package out of
      # the archives, verifies the version pins and the exec bits, and packs all
      # three. No registry contact: publish.mjs uploads only with --publish.
      - name: Assemble, verify and pack the npm packages
        run: node npm/publish.mjs --archives dist --pack tarballs

      # The same install e2e ci.yml runs, but pointed at the binary that is about
      # to be published rather than at a Debug build: pack, `npm install --offline`
      # into throwaway projects, and run the CLI through both @zigapagos/cli and
      # the bare `zigapagos` alias. This is the only place the ReleaseFast musl
      # binary is executed through the npm launcher.
      - name: Install and run the packaged CLI (tests/npm/packaging.sh)
        env:
          ZIGAPAGOS_BIN: ${{ github.workspace }}/npm/cli-linux-x64/zigapagos
        run: bash tests/npm/packaging.sh

      # Kept for one day so a failed or suspicious release can be inspected —
      # `tar tzf` on the exact tarball the publish job would have uploaded.
      - name: Upload the npm tarballs
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: tarballs/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    # Tag pushes only: a PR or dispatch run stops after `build`.
    if: github.event_name == 'push'
    # `runtime-asset` is a hard dependency, not an ordering preference: a release
    # published without it is a release whose advertised install method 404s
    # halfway through, on every host, until the next tag.
    needs: [build, runtime-asset]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Re-asserted rather than inherited: `needs` guarantees the build jobs
      # succeeded, not that this job checked out the same thing they did.
      - name: Check tag against build.zig.zon
        run: scripts/assert-version.sh "$GITHUB_REF_NAME"

      - name: Download every target's archive
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # Into the same directory, so it is checksummed with everything else and
      # uploaded by the same `dist/*`. install.sh verifies it against the very
      # SHA256SUMS the next step writes.
      - name: Download the runtime asset
        uses: actions/download-artifact@v8
        with:
          name: runtime-asset
          path: dist

      - name: Checksum the archives
        working-directory: dist
        run: |
          mapfile -t archives < <(
            find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.xz' \) \
              -printf '%P\n' | sort
          )
          # Fail loudly rather than publishing an empty release.
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::no release archives were produced"
            exit 1
          fi
          printf 'archive: %s\n' "${archives[@]}"
          # Checksum an explicit list, never a glob. An unmatched glob is passed
          # through literally, and `> SHA256SUMS` creates the file *before*
          # sha256sum runs — so a glob fallback would hash SHA256SUMS itself and
          # publish a digest for a file that did not exist when the run started.
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      # The release body is the CHANGELOG section for this version, not
      # `--generate-notes`' commit list. scripts/extract-release-notes.sh exits
      # non-zero if the section is missing or empty; the build jobs already ran
      # the same check with `--check`, so reaching a failure here means
      # CHANGELOG.md changed under the tag.
      - name: Extract release notes from CHANGELOG.md
        run: scripts/extract-release-notes.sh "$GITHUB_REF_NAME" > RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag \
            dist/*

  publish-npm:
    # TWO conditions, and each one is a separate deliberate act.
    #
    #   1. a v* tag push — a PR or dispatch run never reaches this job at all;
    #   2. the repository VARIABLE NPM_PUBLISH_ENABLED set to 'true'. Until someone
    #      sets it, this job is skipped and a tag ships exactly what it ships today.
    #      It is a variable and not a secret because `vars` is the only one of the
    #      two contexts allowed in a job-level `if`.
    #
    # Neither condition involves a credential, because authentication is npm OIDC
    # TRUSTED PUBLISHING. This job proves its identity with the `id-token: write`
    # credential GitHub mints for the run, and the registry exchanges that for a
    # short-lived publish token because each package has a trusted publisher
    # configured on npmjs.com naming this repository and this workflow file. So
    # the right to publish belongs to *this workflow*, not to a long-lived
    # credential that anything able to read it could use, and there is nothing to
    # rotate or leak.
    #
    # Consequences worth knowing before debugging a failure here:
    #
    #   - a package with no trusted publisher configured is rejected by the
    #     registry (403/404). The fix is on npmjs.com; there is nothing to add to
    #     this repository;
    #   - OIDC cannot bootstrap a name that has never been published, so the FIRST
    #     publish of any new package is still a human with `npm login` (npm/README.md);
    #   - renaming this file, or moving the publish to another workflow, invalidates
    #     every trusted publisher — they are configured against `release.yml` by name.
    #
    # `needs: npm-package` is load-bearing beyond ordering: nothing is uploaded
    # until the same tree has been packed, installed and run.
    if: github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED == 'true'
    needs: [npm-package, publish]
    runs-on: ubuntu-latest
    permissions:
      # The OIDC identity npm exchanges for a publish token, and what
      # `--provenance` signs the packages against.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `registry-url` writes an .npmrc naming registry.npmjs.org explicitly. It is
      # kept because that is the arrangement npm documents for trusted publishing,
      # not because the default would be a different registry. Worth knowing when
      # reading that file on a runner: it also contains an `_authToken` line
      # interpolating an environment variable that nothing here sets. npm >= 11.5
      # obtains its own short-lived token from the run's OIDC identity rather than
      # reading a credential out of that file, so the placeholder stays empty.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # OIDC trusted publishing is an npm >= 11.5 feature. An older npm does not
      # fail cleanly on it — it has no idea the mechanism exists, so it looks for a
      # stored credential, finds none, and reports a bare authentication error that
      # names nothing about the real cause. Worse, it would report it partway
      # through a dependency-ordered publish, with some packages already uploaded
      # at a version that cannot be replaced.
      #
      # The version that matters is not implied by `node-version: 24`. setup-node
      # resolves that to whatever the newest 24.x is WHEN THE JOB RUNS, and the npm
      # each release bundles is a property of that release: node 24.2.0 ships npm
      # 11.3.0, which is too old, and 24.5.0 was the first to ship 11.5.1. Newest
      # 24.x is comfortably past that today, but "past it because the runner
      # drifted far enough" is luck rather than a guarantee — and it is not a
      # guarantee we want to re-earn on a tag. So install an npm that has the
      # feature, then assert the result, before a single byte is uploaded.
      #
      # The range holds the MAJOR deliberately. `^11.5.0` on a runner that has
      # started bundling npm 12 installs 11.x over it, which is the direction we
      # want: a major version of the publishing tool should change on a commit that
      # says so, not on the day GitHub refreshes an image, and it would change on a
      # tag — the one run nobody gets to re-do.
      - name: Ensure npm can do OIDC trusted publishing
        run: |
          set -euo pipefail
          required=11.5.0
          npm install --global "npm@^${required}"
          have="$(npm --version)"
          echo "npm ${have} (OIDC trusted publishing requires >= ${required})"
          # `sort -V` orders version strings; if the older of the two is not the
          # requirement, what is installed is older than the requirement. GNU
          # coreutils, which this ubuntu-latest job has.
          oldest="$(printf '%s\n%s\n' "$required" "$have" | sort -V | head -n1)"
          if [ "$oldest" != "$required" ]; then
            echo "::error::npm ${have} is too old for OIDC trusted publishing (needs >= ${required})."
            echo "The publish itself would have failed as an unexplained authentication"
            echo "error, after uploading some of the packages. Nothing was uploaded."
            exit 1
          fi

      # Re-asserted rather than inherited, for the same reason the GitHub-release
      # job re-asserts it: `needs` says the other jobs passed, not that this one
      # checked out what they did. The npm versions come from build.zig.zon, so a
      # mismatch here would publish a version the tag does not name.
      - name: Check tag against build.zig.zon
        run: scripts/assert-version.sh "$GITHUB_REF_NAME"

      - name: Release target drift gate
        run: node npm/check-targets.mjs

      # And the dependency ranges @zigapagos/cli publishes: preact from
      # runtime/package.json, @zigbase/server from src/cli/zigbase.zig's
      # pinned_version, bun from mise.toml. A zigbase range that has drifted from
      # the pin ships a CLI whose `dev` installs one version over npm and
      # downloads another on a PATH miss. ci.yml runs the same gate on every PR
      # through tests/npm/toolchain.sh; here it guards the release itself.
      - name: Toolchain dependency drift gate
        run: node npm/check-toolchain.mjs

      - name: Download every target's archive
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      # Platform packages first, then @zigapagos/cli, then the bare `zigapagos`
      # alias — publish.mjs enforces that order and skips any version already on
      # the registry, so a partially failed release is safe to re-run.
      - name: Publish to npm
        run: node npm/publish.mjs --archives dist --publish --provenance
