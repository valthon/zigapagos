name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not caution. build/config.zig derives the
      # version from `git describe --match '*.*.*' --tags`, and build/release.zig
      # registers a *failing* `release` step unless that returns an exact tag. A
      # shallow checkout has no tags, so `release` would fail with
      # "git tag missing, cannot make release builds" on every run.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain (zig + bun via mise)
        uses: jdx/mise-action@v2

      # build/release.zig also refuses to build when the tag disagrees with the
      # zon package version. That check is worth duplicating here only because it
      # otherwise surfaces after the cross-compiles have already run; failing in
      # two seconds with the two values side by side is a much better signal.
      - name: Check tag matches build.zig.zon version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          zon="$(sed -n 's/^[[:space:]]*\.version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' build.zig.zon)"
          echo "tag=$tag zon=$zon"
          if [ "$tag" != "$zon" ]; then
            echo "::error::tag '$GITHUB_REF_NAME' does not match build.zig.zon version '$zon' — bump the zon version in the commit you tag"
            exit 1
          fi

      - name: Build release matrix
        run: zig build release

      # Fail loudly rather than publishing an empty release: `zig build release`
      # can succeed with nothing installed if the target matrix is ever emptied.
      - name: Collect artifacts
        run: |
          ls -l zig-out/releases
          count=$(find zig-out/releases -type f \( -name '*.zip' -o -name '*.tar.xz' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::no release archives were produced"
            exit 1
          fi
          cd zig-out/releases && sha256sum *.zip *.tar.xz > SHA256SUMS 2>/dev/null || sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            zig-out/releases/*
