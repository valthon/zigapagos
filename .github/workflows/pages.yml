name: Deploy site to Pages

# Chained off CI rather than racing it on the same push.
#
# Two things follow from that, and both are the point:
#
#   1. A deploy can only come from a commit whose CI passed. On the old `push:`
#      trigger this workflow ran concurrently with ci.yml, so a commit that
#      broke the test suite still published the site — the deploy gates below
#      caught site breakage, but nothing else.
#
#   2. ci.yml's build-binary job has, by then, uploaded a `zigapagos` binary for
#      this exact commit. The site build downloads it instead of compiling the
#      generator: 653 compile steps become zero, 23s becomes 2s.
#
# The `paths:` filter is gone with the push trigger. Every green main build now
# deploys, which is the right trade when the build is seconds — filtering would
# mean reasoning about which paths can affect rendered output, and `src/**` and
# `runtime/**` were already in that list because almost anything can.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Downloading an artifact produced by the triggering ci.yml run.
  actions: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    # `workflow_run` fires on completion regardless of outcome, so the success
    # check is what makes this a gate rather than a notification. A manual
    # dispatch has no workflow_run context and is allowed through deliberately.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # Same location ci.yml's build-binary job writes. Only the fallback path
      # below — where no prebuilt binary was available and one is compiled from
      # source — reads it.
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      # A workflow_run job checks out the DEFAULT BRANCH unless told otherwise,
      # which on a busy main would deploy a different commit than the one CI
      # green-lit. Pin it to the triggering run's head.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # v4 is the Node 24 runtime bump (v2/v3 are Node 20, which GitHub has
      # deprecated and is already force-running on Node 24 with an annotation).
      # No input changes: `cache` still defaults to true, and the v3 additions
      # (`env`, `export_path`) are no-ops for a mise.toml that declares only
      # [tools].
      - name: Setup toolchain (zig + bun via mise)
        uses: jdx/mise-action@v4

      # The site build bundles the shipped runtime by invoking
      # runtime/sidecar/bundle-island.ts on runtime/src/browser-entry.ts. Bun
      # resolves that entry's imports upward from runtime/src, so `preact`,
      # `preact/compat` and `preact-render-to-string` must be present in
      # runtime/node_modules. Installing only in site/ does not put them on that
      # resolution path — site/node_modules holds `@z/runtime` as a link, not
      # the runtime's own dependency tree — so every Pages run failed the
      # zigapagos-runtime bundle step with nine `Could not resolve` errors.
      # This mirrors the same install ordering ci.yml already does.
      # The generator CI just built for THIS commit.
      #
      # `site/build.sh` reads ZIGAPAGOS_BIN and compiles nothing when it is set.
      # Unset, it falls back to `zig build` at the repository root — 653 compile
      # steps, 632 of them tree-sitter grammar objects, for site build work of
      # 0.69s.
      #
      # `run-id` is what makes this cross-workflow: the artifact belongs to the
      # ci.yml run that triggered this one, not to this run. Needs `actions:
      # read`, granted above.
      #
      # Skipped on a manual dispatch, which has no triggering run to pull from —
      # that path falls through to a source build, exactly as before.
      - name: Download the zigapagos CI built for this commit
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: zigapagos-${{ runner.os }}
          path: ${{ github.workspace }}/prebuilt
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # Verified before use rather than trusted. A binary that will not report
      # its own version is not one to render the published site with, and
      # falling back to a source build is strictly better than failing the
      # deploy — the previous good deployment stays live either way, but a
      # fallback keeps this one shipping.
      - name: Use it, or fall back to building from source
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          bin="$GITHUB_WORKSPACE/prebuilt/zigapagos"
          if [ -f "$bin" ]; then
            chmod +x "$bin"
            if "$bin" version > /dev/null 2>&1; then
              echo "ZIGAPAGOS_BIN=$bin" >> "$GITHUB_ENV"
              echo "using the binary from CI run ${{ github.event.workflow_run.id }}: $("$bin" version)"
            else
              echo "::warning::downloaded zigapagos will not run; building from source instead"
            fi
          else
            echo "::warning::no zigapagos artifact in the triggering run; building from source instead"
          fi

      # Fallback path only. With ZIGAPAGOS_BIN set nothing compiles, so
      # restoring a cache of compiled objects would be pure latency. Everything
      # gated on `env.ZIGAPAGOS_BIN == ''` below exists for the one case where
      # this job has to build the binary itself.
      - name: Get Zig version
        if: env.ZIGAPAGOS_BIN == ''
        id: zig-version
        run: echo "version=$(zig version)" >> "$GITHUB_OUTPUT"

      # Restore-only, and deliberately not gated on a hit.
      #
      # The fallback build compiles the generator and its whole dependency tree:
      # 653 compile steps, 632 of them tree-sitter grammar objects across 82
      # languages. With no cache at all this workflow once spent 6m11s of a
      # 6m34s job inside that one step, to produce a site whose own build work is
      # 0.69s. ci.yml's build-binary job writes exactly these objects.
      #
      # This workflow cannot `needs:` a job in ci.yml — both trigger on push to
      # main and run concurrently — so it takes whatever that key chain offers.
      # A miss costs nothing beyond today's behaviour; a prefix hit (the common
      # case, since most pushes do not touch build/ or src/) reuses the whole
      # tree because Zig's cache is content-addressed.
      - name: Restore Zig cache (compiled objects, then packages)
        if: env.ZIGAPAGOS_BIN == ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.zig-global-cache
          key: zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build/**', 'src/**') }}
          restore-keys: |
            zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-
            zig-pkg-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-

      - name: Install runtime dependencies (site build bundles @z/runtime)
        working-directory: runtime
        run: bun install --frozen-lockfile

      # Compile a binary only if the download above did not produce one. The
      # site build itself never invokes a compiler: `site/build.sh` runs the
      # `zigapagos` binary over the tree.
      - name: Build zigapagos from source (fallback only)
        if: env.ZIGAPAGOS_BIN == ''
        run: zig build

      # The one canonical invocation — bun install, docs-mirror generation and
      # the `zigapagos release` flags all live in the script, so this workflow
      # and ci.yml's `site` job cannot drift apart on how the site is built.
      - name: Build site
        run: bash site/build.sh

      # A DEPLOY GATE, and deliberately placed between the build and the upload.
      #
      # site/test/build.sh asserts five properties of the finished tree: that
      # index.html exists at all, that the runtime URL carries the /zigapagos/
      # Pages path prefix (a prefix regression makes every script 404 on the
      # live site while the build still exits 0), that the Counter island's
      # client bundle was emitted, that the island was actually SSR'd
      # (data-z-props present), and that no upstream branding leaked into the
      # output.
      #
      # Here the build above has already happened and the script re-runs
      # `site/build.sh`, whose bun install and docs-mirror generation are warm
      # no-ops, so the assertions cost seconds.
      #
      # Running BEFORE `Upload artifact` is the whole point: a failure here
      # fails the build job, the artifact is never uploaded, and `deploy`
      # (which `needs: build`) never runs — so the previous good deployment
      # stays live. Moved below the upload it would still go red, but it would
      # go red about a site that had already shipped.
      #
      # The gap this note used to record — that these assertions ran nowhere on
      # the PR path, so a change breaking one of them merged green and was
      # caught at deploy time — is closed: ci.yml's `site` job runs all four on
      # every pull request (#76). The measurement that note asked for came in at
      # 4s for the build and under 5s for the four scripts, because that job
      # takes build-binary's already-built `zigapagos` and compiles nothing.
      #
      # They stay HERE as well, and not as a formality. A PR is not the only way
      # main moves, and this is the last gate before bytes go live: keeping it
      # means a direct push, a revert, or a merge whose result differs from what
      # any single PR was tested against still cannot ship a broken site.
      - name: Assert the built site before uploading it (site/test/build.sh)
        run: bash site/test/build.sh

      # Also a deploy gate, same placement logic as build.sh above: before the
      # upload, so a failure here keeps the previous deployment live instead
      # of shipping a broken one.
      #
      # This script's two reasons for existing — "no mirror is ever tracked
      # in git" and "the generator is deterministic" — never ran anywhere
      # else. build.sh above only exercises the generator's HAPPY path (it
      # calls it once, to produce the mirrors the render needs); it does not
      # check for a hand-edited/committed mirror or a second run producing a
      # diff. ci.yml's `tests/*/*.sh` glob does not reach site/test/, so
      # without this step those properties were asserted by a script nothing
      # ever ran.
      - name: Assert the docs mirror is fresh, deterministic, and untracked (site/test/docs-mirror.sh)
        run: bash test/docs-mirror.sh
        working-directory: site

      # Also a deploy gate, same placement logic as the two above: before the
      # upload, so a failure keeps the previous deployment live instead of
      # shipping a broken one. Catches the one class of bug the build itself
      # can't: a hand-written href that resolves in local preview (no prefix)
      # and 404s on Pages (prefixed) — see site/test/links.sh's own header.
      - name: Assert internal links resolve in the built tree (site/test/links.sh)
        run: bash test/links.sh
        working-directory: site

      # Pins the "zero JS by default" claim the landing page's copy makes:
      # no docs page may ship a module script, and the landing page's own
      # bundles (plus the inline theme script every page carries) stay under
      # the ceilings site/test/js-budget.sh states. Without this, the claim
      # goes quietly false the first time a bundle grows or an island lands
      # in the docs shell — nothing else in this pipeline would notice.
      - name: Assert the JavaScript budget (site/test/js-budget.sh)
        run: bash test/js-budget.sh
        working-directory: site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/zig-out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
