name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - 'runtime/**'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # v4 is the Node 24 runtime bump (v2/v3 are Node 20, which GitHub has
      # deprecated and is already force-running on Node 24 with an annotation).
      # No input changes: `cache` still defaults to true, and the v3 additions
      # (`env`, `export_path`) are no-ops for a mise.toml that declares only
      # [tools].
      - name: Setup toolchain (zig + bun via mise)
        uses: jdx/mise-action@v4

      # The site build bundles the shipped runtime by invoking
      # runtime/sidecar/bundle-island.ts on runtime/src/browser-entry.ts. Bun
      # resolves that entry's imports upward from runtime/src, so `preact`,
      # `preact/compat` and `preact-render-to-string` must be present in
      # runtime/node_modules. Installing only in site/ does not put them on that
      # resolution path — site/node_modules holds `@z/runtime` as a link, not
      # the runtime's own dependency tree — so every Pages run failed the
      # zigapagos-runtime bundle step with nine `Could not resolve` errors.
      # This mirrors the same install ordering ci.yml already does.
      - name: Install runtime dependencies (site build bundles @z/runtime)
        working-directory: runtime
        run: bun install --frozen-lockfile

      - name: Build site
        run: |
          bun install --frozen-lockfile
          bun run scripts/gen-docs-mirror.ts
          zig build
        working-directory: site

      # A DEPLOY GATE, and deliberately placed between the build and the upload.
      #
      # site/test/build.sh asserts five properties of the finished tree: that
      # index.html exists at all, that the runtime URL carries the /zigapagos/
      # Pages path prefix (a prefix regression makes every script 404 on the
      # live site while the build still exits 0), that the Counter island's
      # client bundle was emitted, that the island was actually SSR'd
      # (data-z-props present), and that no upstream branding leaked into the
      # output.
      #
      # It ran nowhere before this. It is not free anywhere else — site/ is a
      # third consumer project with its own .zig-cache, so no ci.yml job has a
      # warm one and adopting it there costs a full ~120s cold build. Here the
      # build above has already happened and the script's own `bun install` +
      # `zig build` are warm no-ops, so the five greps cost ~2s.
      #
      # Running BEFORE `Upload artifact` is the whole point: a failure here
      # fails the build job, the artifact is never uploaded, and `deploy`
      # (which `needs: build`) never runs — so the previous good deployment
      # stays live. Moved below the upload it would still go red, but it would
      # go red about a site that had already shipped.
      #
      # KNOWN GAP, stated rather than glossed: this workflow triggers on push
      # to main and manual dispatch only, so these assertions do not gate a PR.
      # A change that breaks one of them merges green and is caught at deploy
      # time. That is the accepted cost of the ~2s placement over a ~120s one
      # on the PR path; if the trade ever needs revisiting, the number to beat
      # is that 120s cold consumer build.
      - name: Assert the built site before uploading it (site/test/build.sh)
        run: bash site/test/build.sh

      # Also a deploy gate, same placement logic as build.sh above: before the
      # upload, so a failure here keeps the previous deployment live instead
      # of shipping a broken one.
      #
      # This script's two reasons for existing — "no mirror is ever tracked
      # in git" and "the generator is deterministic" — never ran anywhere
      # else. build.sh above only exercises the generator's HAPPY path (it
      # calls it once, to produce the mirrors zig build needs); it does not
      # check for a hand-edited/committed mirror or a second run producing a
      # diff. ci.yml's `tests/*/*.sh` glob does not reach site/test/, so
      # without this step those properties were asserted by a script nothing
      # ever ran.
      - name: Assert the docs mirror is fresh, deterministic, and untracked (site/test/docs-mirror.sh)
        run: bash test/docs-mirror.sh
        working-directory: site

      # Also a deploy gate, same placement logic as the two above: before the
      # upload, so a failure keeps the previous deployment live instead of
      # shipping a broken one. Catches the one class of bug the build itself
      # can't: a hand-written href that resolves in local preview (no prefix)
      # and 404s on Pages (prefixed) — see site/test/links.sh's own header.
      - name: Assert internal links resolve in the built tree (site/test/links.sh)
        run: bash test/links.sh
        working-directory: site

      # Pins the "zero JS by default" claim the landing page's copy makes:
      # no docs page may ship a module script, and the landing page's own
      # bundles (plus the inline theme script every page carries) stay under
      # the ceilings site/test/js-budget.sh states. Without this, the claim
      # goes quietly false the first time a bundle grows or an island lands
      # in the docs shell — nothing else in this pipeline would notice.
      - name: Assert the JavaScript budget (site/test/js-budget.sh)
        run: bash test/js-budget.sh
        working-directory: site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/zig-out/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
