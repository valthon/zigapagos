name: CI
on:
  pull_request:
  push:
    branches:
      - main
  # Guarantees the macOS leg a cadence even in a week with no pushes to main —
  # see the matrix note below for why it no longer runs per-PR. Off-the-hour and
  # clear of browser-e2e.yml (04:27) and smoke-published.yml (05:43).
  schedule:
    - cron: "11 3 * * *"
  workflow_dispatch:
concurrency:
  # Cancels pending runs when a PR gets updated.
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true
permissions:
  # Sets permission policy for `GITHUB_TOKEN`
  contents: read

# The suite used to be ONE `tests` job per OS that ran every gate in sequence.
# Measured on the last green main run (30256953045, ubuntu): 20m19s wall, of
# which the single "Shell e2e" step was 16m06s — and inside that step two
# scripts accounted for 15m of the 16m (tests/init/from-astro.sh 9m08s,
# tests/serve/dev.sh 6m08s, because each one builds a whole CONSUMER project
# from scratch). Everything else in the job finished in ~4m10s but could not
# report until the e2e step had drained.
#
# So the job is split along that measured seam, not an aesthetic one: the two
# multi-minute e2e scripts each get their own runner, the remaining ten share a
# third, and the build/unit surface stops waiting behind them. Nothing is gained
# by splitting further — the critical path is now from-astro.sh's two consumer
# builds, which are serial inside that one script.
#
# Every gate the monolith ran still runs, exactly once per run; each job below
# notes which steps it inherited.
jobs:
  # Pure text analysis over the tracked tree: three `git grep`/awk gates that
  # need no compiler, no dependency fetch and no build. Splitting them out means
  # a branding slip or a new leak-detector-disabling test is red ~20s into the
  # run instead of after a 20-minute job.
  #
  # Linux-only by the same argument the allocator gate already carried in the
  # monolith: these read the checked-out bytes and nothing else, so a second run
  # on macOS could not reach a different verdict. (branding.sh and
  # confidentiality.sh previously ran on both OSes for no reason other than
  # living in a matrixed job.)
  gates:
    name: Text gates
    runs-on: ubuntu-latest
    steps:
      # Both of the first two gates are `git grep` over the working tree, so
      # they need a git repo but no history: a shallow checkout is enough.
      - uses: actions/checkout@v7

      # Self-tests first, then the gate — the same order and the same reasoning
      # as the allocator gate below. tests/branding.sh now carries a marker
      # parser (an inline `branding-ok:` opt-out, #60), and a parser has a
      # failure mode a single grep does not: it can go PERMISSIVE without going
      # red. tests/branding.test.sh pins each rule from both sides.
      - name: Branding gate (self-tests, then the gate)
        run: |
          bash tests/branding.test.sh
          bash tests/branding.sh

      - name: Confidentiality gate
        run: tests/confidentiality.sh

      # NO_SLOP.md 2.2a: wrapping std.testing.allocator (or a local alias bound
      # to it) in an ArenaAllocator turns Zig's leak detector OFF for that test.
      # The gate pins the existing sites via scripts/allocator-allowlist.txt —
      # each with a written justification — and fails on a NEW one. Pure
      # bash+awk over src/, so it needs no toolchain.
      - name: Allocator-contract gate (NO_SLOP.md 2.2a)
        run: |
          bash scripts/check-allocator-contracts.test.sh
          bash scripts/check-allocator-contracts.sh

  # The compiler-facing surface: formatting, the snapshot diff, the
  # single-threaded compile guard, all sixteen Zig unit-test steps, the Bun
  # suite, and the API contract-drift gate. This is the only matrixed job —
  # everything below it is Linux-only, exactly as it was in the monolith.
  # Compile the generator ONCE per platform, and write the cache every other
  # job reads.
  #
  # Before this job existed, all four Zig jobs compiled the same tree
  # independently. The cache they shared was saved immediately after
  # `zig build --fetch=all`, so it held downloaded packages and nothing
  # compiled — measured on this repo's own site with `--summary all`, that is
  # 653 compile steps, 632 of them tree-sitter grammar objects across 82
  # languages, plus a ~58s ReleaseFast link, repeated per job. For comparison
  # the site's own build work (Bun bundles + host config) is 0.69s.
  #
  # Everything downstream `needs:` this job purely for the cache it leaves
  # behind. Zig's cache is content-addressed, so a consumer does not need the
  # exact key: a fallback hit on the `zig-build-<os>-<ver>-` prefix still reuses
  # every object whose inputs are unchanged, which for a typical src/ edit is
  # the whole dependency tree.
  build-binary:
    name: Build zigapagos (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS everywhere EXCEPT pull requests.
        #
        # It was the critical path by a wide margin — measured on run
        # 30394314594, 333s against ubuntu's 145s, with every compile-heavy step
        # 2-3x slower (snapshot tests 152s vs 80s, single-threaded check 86s vs
        # 30s) and the Bun-sidecar suites 7x (50s vs 7s, a spawn cost macOS pays
        # per fork/exec). Its run-to-run variance is also much wider: 227s, 327s,
        # 333s across three runs where ubuntu sat at 190s, 185s, 145s.
        #
        # What it catches is platform-specific compile breakage, which is rare
        # per-PR and still gated before anything ships: every push to main runs
        # it, as does the nightly and a manual dispatch. The trade is that such a
        # break is caught at merge rather than on the PR — deliberate, because
        # halving every PR's feedback loop is worth more than catching a rare
        # class one step earlier.
        os: >-
          ${{ github.event_name == 'pull_request'
              && fromJSON('["ubuntu-latest"]')
              || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      - name: No autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Setup toolchain (mise — zig 0.16.0 + bun 1.2)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Pin tool versions globally (shims must resolve outside the repo)
        run: mise use -g zig@0.16.0 bun@1.2

      - name: Get Zig version
        id: zig-version
        run: echo "version=$(zig version)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig cache (compiled objects, then packages)
        id: zig-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.zig-global-cache
          key: zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build/**', 'src/**') }}
          restore-keys: |
            zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-
            zig-pkg-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-

      - name: Fetch dependencies (with retries)
        run: |
          for i in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::zig build --fetch=all attempt $i failed; retrying in 20s..."
            sleep 20
          done
          echo "::error::all dependency fetch attempts failed"
          exit 1

      # Saved after the FETCH and before the build, deliberately: a compile
      # failure below still leaves downstream jobs a populated package cache
      # rather than sending every one of them to the network. This preserves the
      # property build-test's old save had. `continue-on-error` because losing
      # the reservation race is not a build failure.
      - name: Save Zig package cache
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.zig-global-cache
          key: zig-pkg-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-${{ hashFiles('**/build.zig.zon') }}

      # Debug, matching what every downstream job actually compiles.
      #
      # This built ReleaseFast at first, justified as "what website() defaults
      # consumers to". That justification died in the same PR: the consumer
      # builds are now pinned to Debug, and `zig build test` / `check` /
      # `test-*` always used Zig's Debug default. A different optimize mode is a
      # different cache entry, so the warmed objects matched nothing downstream
      # and this job was pure added latency — measured at +6 minutes of critical
      # path with no downstream saving.
      #
      # If a ReleaseFast artifact is ever needed in CI, it belongs in a separate
      # job that nothing blocks on; `zig build release` (build/release.zig) is
      # already ReleaseFast for published binaries regardless.
      - name: Build zigapagos
        run: zig build

      - name: Save Zig cache (now carrying compiled objects)
        if: steps.zig-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/.zig-global-cache
          key: ${{ steps.zig-cache.outputs.cache-primary-key }}

      # THE reusable unit. Downstream jobs consume this binary, not the object
      # cache: with it in place they never invoke the compiler at all, whereas a
      # warm object cache only makes `zig build` cheap. Measured on this repo's
      # site, cold: 23s for a source build, 2s with this binary and zero compile
      # steps.
      - name: Upload zigapagos binary
        uses: actions/upload-artifact@v4
        with:
          name: zigapagos-${{ runner.os }}
          path: zig-out/bin/zigapagos
          retention-days: 1
          if-no-files-found: error

  build-test:
    needs: build-binary
    name: Build + unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows-latest removed: upstream's WindowsWatcher.zig/wuffs.zig don't
        # compile on stable Zig 0.16.0 (os.windows lost OVERLAPPED/PAGE_READONLY);
        # upstream fixed this on Zig 0.17-dev. Re-add with the Zig 0.17 port at
        # the next upstream release-tag sync (see docs/ROADMAP.md fork policy).
        os: >-
          ${{ github.event_name == 'pull_request'
              && fromJSON('["ubuntu-latest"]')
              || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # --- Zig package cache ---
      # Keep third-party git hosts (codeberg.org, code.hexops.org, ...) off the
      # critical path: cache the Zig global package cache and pre-fetch the
      # dependency tree with retries before building. Job-level, so every step —
      # and every process a step spawns — sees the same directory. (It had to be
      # repeated as step-level `env:` while mlugg/setup-zig was in the job,
      # because setup-zig exported its own value through GITHUB_ENV; nothing
      # does that now.)
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      # Kept only on the matrixed job: it exists for the windows-latest entry
      # the matrix comment above is holding a seat for, and is a no-op on
      # ubuntu/macOS where core.autocrlf is already false.
      - name: No autocrlf
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Change if you need git info

      # ONE toolchain action for the whole job. This used to be mlugg/setup-zig
      # for the Zig half plus jdx/mise-action for the bun half — two installs of
      # the same compiler, and setup-zig is still a Node 20 action (there is no
      # v3; upstream has moved to Codeberg), so it was one of the four actions
      # GitHub was force-running on Node 24 with a deprecation annotation.
      # mise.toml is already the repo's single source of truth for both tools
      # (zig 0.16.0 + bun 1.2) and the e2e scripts already shell out through
      # `mise exec`, so dropping setup-zig removes a duplicate install AND the
      # deprecation, and guarantees the compiler CI gates with is the exact one
      # the scripts build with.
      - name: Setup toolchain (mise — zig 0.16.0 + bun 1.2)
        uses: jdx/mise-action@v4
        with:
          cache: true

      # mise-action puts its SHIM directory on PATH, and a shim resolves the tool
      # version from the CURRENT DIRECTORY's mise config. The hermetic e2e scripts
      # spawn `bun` from temp directories OUTSIDE this repo — the stub `zigbase`
      # is a shell script doing `exec bun stub-zigbase.ts`, and the island sidecar
      # is spawned with a generated site as its cwd — where mise.toml does not
      # apply. Without a global default the shim aborts with
      # "No version is set for shim: bun", the stub server never answers, and the
      # dev-loop scripts fail with "dev never became ready", which reads as a
      # server bug rather than a toolchain one.
      #
      # Pinning the same versions globally makes the shims resolve from any cwd.
      # Keep these in lockstep with mise.toml.
      - name: Pin tool versions globally (shims must resolve outside the repo)
        run: |
          mise use -g zig@0.16.0 bun@1.2
          echo "resolving from a directory with no mise config:"
          ( cd "$(mktemp -d)" && bun --version && zig version )

      # Runs immediately after the toolchain is available and before any build:
      # `zig fmt --check` needs only the compiler, no dependency fetch, so a
      # formatting slip fails in seconds instead of after the full suite.
      #
      # The file list comes from `git ls-files`, not from a directory walk. Both
      # `zig-pkg/` and `examples/tsx-site/zig-pkg/` are gitignored trees of
      # MATERIALIZED third-party dependencies, as are `.zig-cache/` and
      # `zig-out/` — so a path-based invocation (`zig fmt --check … examples/`)
      # passes on a clean checkout and then starts failing on vendored source the
      # moment anything runs a build that populates them. Tracked-files-only is
      # both correct and self-maintaining: a new first-party directory is covered
      # with no change here. (The generated `src/hacks/*.h.zig` translate-c dumps
      # ARE tracked and are fmt-clean; they stay in scope deliberately.)
      - name: Formatting gate (zig fmt)
        run: git ls-files -z '*.zig' | xargs -0 -r zig fmt --check

      - name: Get Zig version
        id: zig-version
        run: echo "version=$(zig version)" >> "$GITHUB_OUTPUT"

      - name: Restore Zig cache (compiled objects, then packages)
        id: zig-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.zig-global-cache
          key: zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build/**', 'src/**') }}
          restore-keys: |
            zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-
            zig-pkg-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-

      # Two mechanisms, one binary.
      #
      # `zig-out/bin/zigapagos` is where the shell scripts look — ten of them
      # guard their build with `if [[ ! -x "$ZIGAPAGOS" ]]`, so a binary sitting
      # there means they never call the compiler.
      #
      # `ZIGAPAGOS_BIN` covers the consumer builds those scripts drive
      # (examples/tsx-site, and site/ over in pages.yml), which would otherwise
      # compile the generator and its whole dependency tree per invocation.
      # build/site.zig reads it and switches to `zigapagos = .path`.
      - name: Download zigapagos binary
        uses: actions/download-artifact@v4
        with:
          name: zigapagos-${{ runner.os }}
          path: zig-out/bin

      - name: Use the prebuilt zigapagos
        run: |
          chmod +x zig-out/bin/zigapagos
          echo "ZIGAPAGOS_BIN=$GITHUB_WORKSPACE/zig-out/bin/zigapagos" >> "$GITHUB_ENV"

      - name: Fetch dependencies (with retries)
        run: |
          for i in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::zig build --fetch=all attempt $i failed; retrying in 20s..."
            sleep 20
          done
          echo "::error::all dependency fetch attempts failed"
          exit 1

      # MUST precede the Zig test steps. Several Zig tests spawn the Bun island
      # sidecar, which imports preact-render-to-string from runtime/src —
      # without node_modules those tests fail on a missing package. They used to
      # pass only because `bun` was unresolvable, so `Sidecar.spawn` returned
      # FileNotFound and the tests took their `error.SkipZigTest` path: the
      # sidecar was never actually exercised in CI. Fixing the shim resolution
      # above un-skipped them and exposed this ordering bug.
      - name: Install runtime dependencies (Zig sidecar tests spawn bun)
        working-directory: runtime
        run: bun install --frozen-lockfile

      # `zig build test` runs ONLY the three-root snapshot diff — see CLAUDE.md.
      # The unit tests are the sixteen `test-*` steps further down.
      - name: Snapshot tests (zig build test)
        run: zig build test

      # Single-threaded guard: the single-threaded-only code paths are comptime-pruned
      # from the default build, so compile them explicitly. `check` compiles the
      # exe AND every unit-test binary (test decls are only analyzed in a test
      # compilation — an exe-only check would miss single-threaded rot in
      # test-only code, e.g. a test calling std.Thread.spawn) without running
      # anything, so no bun/network is needed; the dep objects are already warm
      # from the build above.
      - name: Check single-threaded build (exe + all test binaries)
        run: zig build check -Dsingle-threaded

      # --- Full test surface (issue AUD-019) ---
      # The fork's differentiating surface — the island pass, SPA prerender, the
      # dev/serve loop, the migration importer, and the TypeScript runtime — is
      # exercised by these `test-*` steps, by the Bun suite below, and by the
      # hermetic tests/*/*.sh e2e (their own jobs now). None of it ran in CI
      # before AUD-019, so a PR breaking any of it merged green.
      - name: Subsystem unit tests (islands, SPA, dev/serve, migrate, runtime sidecar)
        run: |
          zig build \
            test-islands test-props test-migrate test-sidecar test-init \
            test-release test-spa test-assets test-serve test-e2e test-dev \
            test-doctor test-slugs test-validate test-explain test-diag \
            test-summary

      - name: Runtime TypeScript tests (Bun)
        working-directory: runtime
        run: |
          bun install --frozen-lockfile
          bun test

      # --- Contract drift gate ---
      # `api-check` regenerates the typed API client and fails if the committed
      # contract/generated is stale. build.zig registers the step in BOTH
      # codegen modes but CI never ran it, so contract/generated could drift
      # from contract/zigbase.openapi.json unnoticed.
      #
      # Hermetic in the mode this repo is in: contract/codegen.config.json is
      # absent, so codegenMode() falls back to `openapi` and the step is
      # `bun runtime/scripts/apigen.ts` against the checked-in schema, then
      # `git add` + `git diff --cached --exit-code` (the same pattern the
      # snapshot tests use). No network, no live backend. In `zigbase` mode the
      # step shells out to the backend's gen-client; with the backend absent
      # apiclient.ts degrades to a presence/non-empty check on the committed
      # client rather than failing, so this stays non-flaky either way.
      # Linux-only: the check is OS-independent and one run is enough. It stays
      # inside this job rather than getting its own because it is sub-second
      # once the dependency tree is fetched — a dedicated runner would cost more
      # in setup than the check itself.
      - name: API contract drift (api-check)
        if: runner.os == 'Linux'
        run: zig build api-check


  # The marketing site, built and asserted on the PR path (#76).
  #
  # site/ is a consumer project: it depends on the zigapagos package by path and
  # regenerates ten `.smd` mirrors from the canonical docs before rendering. It
  # is therefore the only place several classes of defect surface at all — a
  # generator change that emits a link SuperMD cannot resolve, a doc edit that
  # breaks the mirror transform, a prefix regression that 404s every script on
  # Pages — and until this job existed none of them were on the PR path. site/
  # was built only by pages.yml (push-to-main, i.e. after merge) and
  # browser-e2e.yml (scheduled). Four PRs merged green in one day while
  # progressively breaking the public site; #76 is the one that stopped the
  # deploy outright.
  #
  # The four scripts below already existed and already ran — as DEPLOY gates in
  # pages.yml, where a failure means the site does not ship and someone has to
  # go back and fix main. Running them here as well moves the same assertions
  # one step earlier without weakening the deploy gate: pages.yml keeps its own
  # copies, because a PR is not the only way main moves.
  #
  # pages.yml's own note asked for a measurement rather than an assumption
  # before adopting this on the PR path, on the grounds that a cold consumer
  # build costs ~120s. That number no longer applies: this job takes the
  # `zigapagos` binary build-binary already produced, exactly as the three e2e
  # jobs do, and with `ZIGAPAGOS_BIN` set nothing compiles. Measured on this
  # repo against a cold site/.zig-cache: 4s for the build, 2s for build.sh, 2s
  # for docs-mirror.sh (which does its own, now-warm, `zig build`), under a
  # second each for links.sh and js-budget.sh. The job's wall time is dominated
  # by runner setup, it `needs:` only build-binary, and it is nowhere near the
  # critical path — the Astro-importer shard is still ~9m.
  #
  # Linux-only, like every other consumer-project job here: the site build is
  # OS-independent and macOS is already off the PR path.
  site:
    needs: build-binary
    name: Build the site (site/)
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
    steps:
      # docs-mirror.sh asserts that no mirror is tracked in git, via
      # `git ls-files --error-unmatch`, so this needs a real repo — but no
      # history, hence the default shallow checkout.
      - uses: actions/checkout@v7

      - name: Setup toolchain (mise — zig 0.16.0 + bun 1.2)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Pin tool versions globally (shims must resolve outside the repo)
        run: mise use -g zig@0.16.0 bun@1.2

      # `ZIGAPAGOS_BIN` is what build/api.zig reads to swap the `zigapagos`
      # dependency from a source build to a path, so site/'s `zig build`
      # performs zero compile steps. No Zig cache restore here, for the same
      # reason pages.yml skips one on this path: with the binary in hand there
      # are no objects to reuse.
      - name: Download zigapagos binary
        uses: actions/download-artifact@v4
        with:
          name: zigapagos-${{ runner.os }}
          path: zig-out/bin

      - name: Use the prebuilt zigapagos
        run: |
          chmod +x zig-out/bin/zigapagos
          echo "ZIGAPAGOS_BIN=$GITHUB_WORKSPACE/zig-out/bin/zigapagos" >> "$GITHUB_ENV"

      # The site build bundles the shipped runtime by invoking
      # runtime/sidecar/bundle-island.ts on runtime/src/browser-entry.ts, and
      # Bun resolves that entry's imports upward from runtime/src. Installing
      # only in site/ does not put preact on that path — site/node_modules holds
      # `@z/runtime` as a link, not the runtime's own dependency tree — and the
      # zigapagos-runtime bundle step then fails with nine `Could not resolve`
      # errors. Same ordering pages.yml documents.
      - name: Install runtime dependencies (the site build bundles @z/runtime)
        working-directory: runtime
        run: bun install --frozen-lockfile

      - name: Build the site
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run scripts/gen-docs-mirror.ts
          zig build

      # Five properties of the finished tree: index.html exists, the runtime URL
      # carries the /zigapagos/ Pages path prefix, the Counter island's client
      # bundle was emitted, the island was actually SSR'd, and no upstream
      # branding leaked into the output.
      - name: Assert the built site (site/test/build.sh)
        run: bash site/test/build.sh

      # Every registry entry produced a file, the frontmatter is Ziggy and not
      # YAML, a second generator run produces no diff, no mirror is tracked in
      # git, and no Scripty directive leaked into rendered prose. Runs the
      # md-to-smd.ts unit tests first — that is where #76's fence-tracker
      # regression is pinned.
      - name: Assert the docs mirror (site/test/docs-mirror.sh)
        working-directory: site
        run: bash test/docs-mirror.sh

      # The one class the build itself cannot catch: a hand-written href that
      # resolves in local preview (no prefix) and 404s on Pages (prefixed).
      - name: Assert internal links resolve (site/test/links.sh)
        working-directory: site
        run: bash test/links.sh

      # Pins the "zero JS by default" claim the landing page makes.
      - name: Assert the JavaScript budget (site/test/js-budget.sh)
        working-directory: site
        run: bash test/js-budget.sh

  # --- Shell e2e, sharded ------------------------------------------------------
  # The three jobs below partition `tests/*/*.sh` — the same glob the monolith
  # used, so a new tests/<area>/ directory is still covered the day it is added.
  # The partition is by EXCLUSION (see e2e-rest): the two dedicated jobs name
  # their one script, the third runs everything else, so a newly added script
  # lands in a job automatically instead of being silently skipped.
  #
  # tests/branding.sh and tests/confidentiality.sh are deliberately outside this
  # glob — they are the `gates` job above.
  #
  # All three are Linux-only, as the monolith's e2e step was: the scripts drive
  # OS-independent build/serve plumbing, so one OS suffices and macOS runner
  # minutes stay down.

  # 9m08s of the old 16m06s e2e step. The script generates a consumer project
  # from the Astro sample and runs `zig build` in it TWICE (islands and
  # no-islands variants), each a from-scratch compile of zigapagos as a
  # dependency — ~4.5 minutes apiece, and serial inside the script. This is the
  # run's critical path; it gets a runner to itself.
  e2e-astro-importer:
    needs: build-binary
    name: Shell e2e — Astro importer
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      # Deliberately NOT sharing ZIG_LOCAL_CACHE_DIR across the projects this
      # job builds. It looks like it should help — zig's local cache is
      # per-project, so the repo build and the two generated consumer projects
      # each compile the same third-party objects from zero, and the cache is
      # content-addressed — but it was tried and measured on run 30260063269 and
      # the two consumer builds moved 263.5s -> 262.3s and 273.2s -> 268.5s,
      # i.e. nothing. The reuse does not happen because each consumer build is a
      # distinct root module and zig keys a compilation on its whole input set,
      # not per source file. Left out rather than left in as a plausible-looking
      # no-op; if this is revisited, the number to beat is ~265s per build.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain (mise — zig 0.16.0 + bun 1.2)
        uses: jdx/mise-action@v4
        with:
          cache: true

      # See build-test for why the global pin is required: the scripts spawn
      # bun and zig from directories outside this repo, where mise.toml does
      # not apply and a bare shim would abort with "No version is set".
      - name: Pin tool versions globally (shims must resolve outside the repo)
        run: |
          mise use -g zig@0.16.0 bun@1.2
          ( cd "$(mktemp -d)" && bun --version && zig version )

      - name: Get Zig version
        id: zig-version
        run: echo "version=$(zig version)" >> "$GITHUB_OUTPUT"

      # Restore-only: build-binary owns both write sides of this key chain.
      - name: Restore Zig cache (compiled objects, then packages)
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.zig-global-cache
          key: zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build/**', 'src/**') }}
          restore-keys: |
            zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-
            zig-pkg-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-

      # Two mechanisms, one binary.
      #
      # `zig-out/bin/zigapagos` is where the shell scripts look — ten of them
      # guard their build with `if [[ ! -x "$ZIGAPAGOS" ]]`, so a binary sitting
      # there means they never call the compiler.
      #
      # `ZIGAPAGOS_BIN` covers the consumer builds those scripts drive
      # (examples/tsx-site, and site/ over in pages.yml), which would otherwise
      # compile the generator and its whole dependency tree per invocation.
      # build/site.zig reads it and switches to `zigapagos = .path`.
      - name: Download zigapagos binary
        uses: actions/download-artifact@v4
        with:
          name: zigapagos-${{ runner.os }}
          path: zig-out/bin

      - name: Use the prebuilt zigapagos
        run: |
          chmod +x zig-out/bin/zigapagos
          echo "ZIGAPAGOS_BIN=$GITHUB_WORKSPACE/zig-out/bin/zigapagos" >> "$GITHUB_ENV"

      - name: Fetch dependencies (with retries)
        run: |
          for i in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::zig build --fetch=all attempt $i failed; retrying in 20s..."
            sleep 20
          done
          echo "::error::all dependency fetch attempts failed"
          exit 1

      - name: Install runtime dependencies (the sidecar the e2e spawns needs them)
        working-directory: runtime
        run: bun install --frozen-lockfile

      - name: tests/init/from-astro.sh
        run: |
          script=tests/init/from-astro.sh
          if [[ ! -f "$script" ]]; then
            echo "::error::$script is gone — this job and e2e-rest's exclusion list must move together, or the script stops running entirely"
            exit 1
          fi
          bash "$script"

  # 6m08s of the old 16m06s e2e step, nearly all of it examples/tsx-site's
  # `zig build dev` — a cold consumer build driving the public zigapagos.dev()
  # API. Same reasoning as the importer job: one long serial script, one runner.
  #
  # That cold consumer build is now this job's second reason to exist: the
  # eleven non-browser examples/tsx-site/test scripts each need one, and this is
  # the only job that has already paid for it. See the second step for the
  # measurement and for why they are named rather than globbed.
  e2e-dev-loop:
    needs: build-binary
    name: Shell e2e — dev loop + tsx-site e2e
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      # No shared ZIG_LOCAL_CACHE_DIR — see e2e-astro-importer for the
      # measurement that says it buys nothing.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain (mise — zig 0.16.0 + bun 1.2)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Pin tool versions globally (shims must resolve outside the repo)
        run: |
          mise use -g zig@0.16.0 bun@1.2
          ( cd "$(mktemp -d)" && bun --version && zig version )

      - name: Get Zig version
        id: zig-version
        run: echo "version=$(zig version)" >> "$GITHUB_OUTPUT"

      # Restore-only: build-binary owns both write sides of this key chain.
      - name: Restore Zig cache (compiled objects, then packages)
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.zig-global-cache
          key: zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build/**', 'src/**') }}
          restore-keys: |
            zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-
            zig-pkg-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-

      # Two mechanisms, one binary.
      #
      # `zig-out/bin/zigapagos` is where the shell scripts look — ten of them
      # guard their build with `if [[ ! -x "$ZIGAPAGOS" ]]`, so a binary sitting
      # there means they never call the compiler.
      #
      # `ZIGAPAGOS_BIN` covers the consumer builds those scripts drive
      # (examples/tsx-site, and site/ over in pages.yml), which would otherwise
      # compile the generator and its whole dependency tree per invocation.
      # build/site.zig reads it and switches to `zigapagos = .path`.
      - name: Download zigapagos binary
        uses: actions/download-artifact@v4
        with:
          name: zigapagos-${{ runner.os }}
          path: zig-out/bin

      - name: Use the prebuilt zigapagos
        run: |
          chmod +x zig-out/bin/zigapagos
          echo "ZIGAPAGOS_BIN=$GITHUB_WORKSPACE/zig-out/bin/zigapagos" >> "$GITHUB_ENV"

      - name: Fetch dependencies (with retries)
        run: |
          for i in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::zig build --fetch=all attempt $i failed; retrying in 20s..."
            sleep 20
          done
          echo "::error::all dependency fetch attempts failed"
          exit 1

      - name: Install runtime dependencies (the sidecar the e2e spawns needs them)
        working-directory: runtime
        run: bun install --frozen-lockfile

      - name: tests/serve/dev.sh
        run: |
          script=tests/serve/dev.sh
          if [[ ! -f "$script" ]]; then
            echo "::error::$script is gone — this job and e2e-rest's exclusion list must move together, or the script stops running entirely"
            exit 1
          fi
          bash "$script"

      # The eleven non-browser scripts under examples/tsx-site/test/. Until now
      # NOTHING ran them — no workflow, no mise task, no hook — and that is not a
      # theoretical gap: spa.sh's nginx assertions had matched nothing since
      # nginxQuote() landed, and nobody could notice, because noticing requires
      # running the file. tests/meta/script-coverage.sh now makes that state
      # declared rather than accidental; this step pays off the cheap half of it.
      #
      # WHY THIS JOB, measured rather than assumed. Every one of these scripts
      # runs `zig build` inside examples/tsx-site, i.e. a full CONSUMER build of
      # zigapagos-as-a-dependency. e2e-dev-loop is the only job that already pays
      # for one — the step above drives examples/tsx-site's own `zig build dev`
      # — so here they land on a warm .zig-cache. In e2e-rest (`tests/*/*.sh`,
      # which builds the REPO, not the example) the same eleven would first buy
      # a cold ~265s consumer build and make THAT job the run's critical path.
      #
      # Measured on run 30313041568, the first run to include this step: 49s for
      # all eleven, against 468s for the dev.sh step above them. Per script —
      # ssr 4.2, parity 4.5, parity-bundle 3.2, incremental 9.3, props_check 6.2,
      # doctor 1.6, spa 4.3, spa_flags 3.2, spa_guards 3.4, spa_nested 3.8,
      # serve 5.3. Note serve.sh: tests/meta/unrun-scripts.txt clocked it at
      # 76.1s, but that was a COLD measurement — behind dev.sh it is ~5s, which
      # is the entire argument for this placement in one number.
      #
      # The cost is real but small, and the margin is thinner than it looks. On
      # the five green runs before this one e2e-dev-loop was 342-528s against
      # e2e-astro-importer's 558-716s; run 30313041568 came in at 536s against an
      # unusually fast 532s importer, i.e. this job took the critical path by 4
      # SECONDS. So the honest claim is: ~49s added, normally well inside the
      # importer's shadow, occasionally a few seconds past it. Every alternative
      # placement is worse, because each one buys another cold consumer build.
      #
      # WHY A LITERAL LIST rather than a glob + exclusion, which is what e2e-rest
      # does. There, self-maintenance is the whole point: a new tests/<area>/
      # script must run without editing this file. Here the opposite is wanted.
      # A glob would silently adopt whatever appears in that directory, including
      # the next script that needs a browser or four minutes, straight onto the
      # PR path. Naming them is also what makes the coverage gate work at all:
      # its rule (b) is "a workflow names it", so a new sibling here is neither
      # CI-run nor inventoried and the gate fails until someone chooses one.
      #
      # NOT LISTED, deliberately: examples/tsx-site/test/hydrate.sh and
      # examples/tsx-site/test/spa_slice.sh. Both drive real Chromium through
      # python3 + playwright (~150MB of browser) and are ~125s each;
      # spa_slice.sh additionally `rm -rf`s .zig-cache and zig-out, which would
      # throw away the warm build this step exists to reuse and force everything
      # after it to rebuild cold. They are NOT unrun — they moved to
      # .github/workflows/browser-e2e.yml, a nightly schedule + workflow_dispatch
      # job with one matrix runner each. Adding them here instead would put a
      # browser install and ~250s on the PR path for a signal almost no PR moves.
      #
      # Those two paths are spelled in full ON PURPOSE: a reader of this file
      # should be able to see exactly which scripts this step excludes and where
      # they went. The mention is inert as far as the coverage gate is concerned,
      # because script-coverage.sh's rule (b) skips comment lines — a property
      # now pinned by tests/meta/script-coverage.test.sh case 5 rather than by
      # this comment. It used to be pinned here, by accident: while these two
      # were inventoried as unrun, dropping the comment filter made the gate see
      # them as both CI-run and listed and fail by name. That accident ended when
      # the inventory went empty, which is exactly why the pin became a test.
      #
      # Two ordering constraints, neither of them aesthetic: parity.sh invokes
      # ssr.sh internally, so ssr.sh runs first and a shared failure is
      # attributed to the cheaper script; and serve.sh is the only one that binds
      # a fixed port (1990, because build.zig does not thread --port through), so
      # it goes last where nothing follows it to collide.
      - name: examples/tsx-site e2e — SSR, parity, props, SPA prerender (non-browser)
        run: |
          scripts=(
            examples/tsx-site/test/ssr.sh
            examples/tsx-site/test/parity.sh
            examples/tsx-site/test/parity-bundle.sh
            examples/tsx-site/test/incremental.sh
            examples/tsx-site/test/props_check.sh
            examples/tsx-site/test/doctor.sh
            examples/tsx-site/test/spa.sh
            examples/tsx-site/test/spa_flags.sh
            examples/tsx-site/test/spa_guards.sh
            examples/tsx-site/test/spa_nested.sh
            examples/tsx-site/test/serve.sh
          )
          # A renamed or deleted script must fail loudly here, not vanish from
          # the suite. script-coverage.sh catches it too (the rename shows up as
          # a script nothing runs), but only on the next run of that gate —
          # this makes the job that lost coverage be the job that says so.
          missing=()
          for script in "${scripts[@]}"; do
            [[ -f "$script" ]] || missing+=("$script")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::listed but absent: ${missing[*]} — update this list and tests/meta/unrun-scripts.txt together"
            exit 1
          fi

          # Collected, not fail-fast. These scripts are running in CI for the
          # first time; one rotted assertion should not hide the other ten.
          failed=()
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            if bash "$script"; then
              echo "::endgroup::"
            else
              rc=$?
              echo "::endgroup::"
              echo "::error file=$script::$script failed (exit $rc)"
              failed+=("$script")
            fi
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::${#failed[@]} script(s) failed: ${failed[*]}"
            exit 1
          fi

  # The other ten scripts: ~49s of the old 16m06s between them. Discovered by
  # glob and filtered by exclusion, so a script added under tests/<area>/
  # tomorrow runs here with no edit to this file.
  e2e-rest:
    needs: build-binary
    name: Shell e2e — everything else
    runs-on: ubuntu-latest
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.zig-global-cache
      # No shared ZIG_LOCAL_CACHE_DIR — see e2e-astro-importer for the
      # measurement that says it buys nothing.
      # Scripts that have a DEDICATED job above. Kept as an exclusion list
      # rather than an inclusion list so the glob below stays self-maintaining:
      # forget to list a newly added script and it still runs here. The only way
      # to lose coverage is to delete or rename one of these two, which the
      # existence check in the step below catches.
      SHARDED_OUT: tests/init/from-astro.sh tests/serve/dev.sh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain (mise — zig 0.16.0 + bun 1.2)
        uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Pin tool versions globally (shims must resolve outside the repo)
        run: |
          mise use -g zig@0.16.0 bun@1.2
          ( cd "$(mktemp -d)" && bun --version && zig version )

      - name: Get Zig version
        id: zig-version
        run: echo "version=$(zig version)" >> "$GITHUB_OUTPUT"

      # Restore-only: build-binary owns both write sides of this key chain.
      - name: Restore Zig cache (compiled objects, then packages)
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/.zig-global-cache
          key: zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-${{ hashFiles('build.zig', 'build.zig.zon', 'build/**', 'src/**') }}
          restore-keys: |
            zig-build-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-
            zig-pkg-${{ runner.os }}-${{ steps.zig-version.outputs.version }}-

      # Two mechanisms, one binary.
      #
      # `zig-out/bin/zigapagos` is where the shell scripts look — ten of them
      # guard their build with `if [[ ! -x "$ZIGAPAGOS" ]]`, so a binary sitting
      # there means they never call the compiler.
      #
      # `ZIGAPAGOS_BIN` covers the consumer builds those scripts drive
      # (examples/tsx-site, and site/ over in pages.yml), which would otherwise
      # compile the generator and its whole dependency tree per invocation.
      # build/site.zig reads it and switches to `zigapagos = .path`.
      - name: Download zigapagos binary
        uses: actions/download-artifact@v4
        with:
          name: zigapagos-${{ runner.os }}
          path: zig-out/bin

      - name: Use the prebuilt zigapagos
        run: |
          chmod +x zig-out/bin/zigapagos
          echo "ZIGAPAGOS_BIN=$GITHUB_WORKSPACE/zig-out/bin/zigapagos" >> "$GITHUB_ENV"

      - name: Fetch dependencies (with retries)
        run: |
          for i in 1 2 3; do
            if zig build --fetch=all; then
              exit 0
            fi
            echo "::warning::zig build --fetch=all attempt $i failed; retrying in 20s..."
            sleep 20
          done
          echo "::error::all dependency fetch attempts failed"
          exit 1

      - name: Install runtime dependencies (the sidecar the e2e spawns needs them)
        working-directory: runtime
        run: bun install --frozen-lockfile

      - name: Shell e2e — config, init, islands, rendering, serve, spa (hermetic)
        run: |
          shopt -s nullglob
          discovered=(tests/*/*.sh)
          if [[ ${#discovered[@]} -eq 0 ]]; then
            echo "::error::no tests/*/*.sh found — the glob or the layout changed"
            exit 1
          fi

          # A renamed or deleted dedicated script must not silently vanish from
          # the suite. Its own job would fail — but only while it is still named
          # there — so assert the two lists agree from this side as well.
          for sharded in $SHARDED_OUT; do
            if [[ ! -f "$sharded" ]]; then
              echo "::error::$sharded is listed as sharded-out but does not exist — update this list and its dedicated job together"
              exit 1
            fi
          done

          scripts=()
          for script in "${discovered[@]}"; do
            case " $SHARDED_OUT " in
              *" $script "*) continue ;;
            esac
            scripts+=("$script")
          done
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "::error::every discovered script was excluded — the shard split is wrong"
            exit 1
          fi

          echo "running ${#scripts[@]} shell e2e script(s)"
          failed=()
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            if bash "$script"; then
              echo "::endgroup::"
            else
              rc=$?
              echo "::endgroup::"
              echo "::error file=$script::$script failed (exit $rc)"
              failed+=("$script")
            fi
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error::${#failed[@]} script(s) failed: ${failed[*]}"
            exit 1
          fi
