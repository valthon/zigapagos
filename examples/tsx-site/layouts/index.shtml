<!DOCTYPE html>
<html>
  <head>
    <title :text="$page.title"></title>
    <link type="text/css" rel="stylesheet" href="$site.asset('style.css').link()">
    <!-- Deliberately inline, and deliberately preceded by a comment that names
         the <style> and <script> tags below it: together they prove the emitted
         CSP hashes the real elements byte-exactly and hashes nothing that only
         LOOKS like markup inside a comment (test/spa_csp_playwright.py, #130). -->
    <style>h1 { letter-spacing: 0.01em; }</style>
  </head>
  <body>
    <h1 :text="$page.title"></h1>

    <island src="components/Hero.island.tsx" client:load prop-headline="$page.title"></island>

    <island src="components/Flagged.island.tsx" client:load :props='{ .label = "hi" }'></island>

    <island src="components/Panel.island.tsx" client:load :props='{ .title = "Panel" }'>
      <template slot="heading"><h2>Custom Heading</h2></template>
      <p>default body</p>
      <island src="components/Hero.island.tsx" client:load prop-headline="Nested"></island>
    </island>

    <island src="components/Widget.island.tsx" client:load :props='{ .label = "Clicks" }'></island>

    <div :html="$page.content()"></div>
  </body>
</html>
