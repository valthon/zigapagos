<!--
  Hand-authored source for the site's Open Graph card. The file social scrapers
  actually fetch is the RASTERISED og.png beside it (base.shtml's og:image);
  this SVG is published too, but only for direct linking.

  EDIT THIS FILE, THEN REGENERATE:

      python3 site/scripts/rasterise-og.py

  That one command rewrites og.png AND refreshes
  site/scripts/og.svg.sha256, the stamp recording this file's content hash
  at the last regeneration.
  site/test/build.sh compares the stamp against the current hash and fails when
  they differ, so a card edited here and not regenerated is caught on the pull
  request rather than discovered months later in a link preview. (Content hash,
  not mtime: git does not preserve mtimes, so a "PNG older than SVG" check would
  be vacuous in a fresh CI checkout.)

  See the script's docstring for why the rasteriser is a browser: the two
  font-family stacks below are CSS system-font keywords, which the standalone
  SVG rasterisers do not resolve.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0d1013"/>
  <circle cx="980" cy="150" r="26"  fill="#252c32"/>
  <circle cx="1080" cy="250" r="18" fill="#252c32"/>
  <circle cx="940"  cy="300" r="16" fill="#252c32"/>
  <circle cx="1050" cy="420" r="44" fill="#3fd0bd"/>
  <circle cx="1050" cy="420" r="70" fill="none" stroke="#3fd0bd" stroke-opacity="0.25" stroke-width="3"/>
  <text x="90" y="250" font-family="system-ui, sans-serif" font-size="86" font-weight="700" fill="#e6e9ea" letter-spacing="-3">Zigapagos</text>
  <text x="90" y="330" font-family="system-ui, sans-serif" font-size="38" fill="#9aa3ab">Astro's islands. A native core. No Node.</text>
  <text x="90" y="420" font-family="ui-monospace, monospace" font-size="26" fill="#3fd0bd">zero JS by default · TSX islands · native SPAs</text>
</svg>
