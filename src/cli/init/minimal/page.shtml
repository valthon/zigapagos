<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title :text="$page.title"></title>
        <link rel="canonical" href="$page.absLink()">

            <a href="$site.page('').link()" :text="$site.title"></a>

        </main>
    </body>
</html>
