<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Abs Link Multi</title>

    <!-- PAGE asset via absLink: must be absolute AND carry the locale's
         output prefix. This is the one Copilot caught on #69: the flag
         `printLinkPrefix` takes is only honoured across variants, and a page
         asset is always in the page's own variant, so this used to come back
         as a bare `/page-og.png`. -->
    <link rel="canonical" href="https://de.example.com/de-DE/page-og.png">

    <!-- SITE asset via absLink: must keep a separator between
         `assets_prefix_path` and the asset name. This used to render as
         `https://example.com/staticsite.css`. -->
    <meta property="og:image" content="https://de.example.com/static/site.css">

    <!-- CROSS-VARIANT page asset via absLink, into a locale that sets
         `host_url_override`. `printLinkPrefix` already prints the host across
         variants, so absLink must NOT print it again — this pins exactly one
         host. Regressed once as
         `https://de.example.comhttps://de.example.com/de-DE/page-og.png`. -->
    <meta name="cross-variant-abs" content="https://de.example.com/de-DE/page-og.png">

    <!-- Control for the cell above: the same expression through plain link().
         It is already absolute cross-variant (different host), and no absLink
         change may alter it. -->
    <meta name="cross-variant-rel" content="/de-DE/page-og.png">

    <!-- Control: plain link() stays root-relative and locale-prefixed, so a
         regression that made everything absolute would fail here too. -->
    <link rel="icon" href="/de-DE/logo.png">
  </head>
  <body>
    <h1>Home</h1>
    <div><p>This locale sets <code>host_url_override</code>, which is what makes the cross-variant <code>absLink()</code> cell in the layout meaningful: linking into it from another locale crosses a host boundary, so <code>printLinkPrefix</code> prints a host of its own and <code>absLink()</code> must not add a second one.</p></div>
  </body>
</html>
