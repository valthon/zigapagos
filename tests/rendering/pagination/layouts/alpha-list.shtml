<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title :text="$site.title"></title>
  </head>
  <body>
    <h1 :text="$page.title"></h1>
    <!-- subpagesAlphabetic(), not subpages(): windowing must apply on
         DATE order first, THEN the window gets alpha-sorted -- never sort
         the whole section alphabetically and window that (see the fixture
         content: date order and alpha order are deliberately reversed, so
         a sort-then-window regression swaps page 1 and page 2 entirely). -->
    <ul :loop="$page.subpagesAlphabetic()">
      <li :text="$loop.it.title"></li>
    </ul>
    <ctx :if="$page.pagination?()">
      <ctx pg="$if">
        <p>
          Page <span :text="$ctx.pg.current"></span> of <span :text="$ctx.pg.total"></span>
          (<span :text="$ctx.pg.total_items"></span> items, <span :text="$ctx.pg.page_size"></span>/page)
        </p>
        <ctx :if="$ctx.pg.prevLink?()">
          <a href="$if">newer</a>
        </ctx>
        <ctx :if="$ctx.pg.nextLink?()">
          <a href="$if">older</a>
        </ctx>
        <a href="$ctx.pg.pageLink(1)">first</a>
        <ctx other="$site.page('news')">
          <ul id="other-section-subpages" :loop="$ctx.other.subpages()">
            <li :text="$loop.it.title"></li>
          </ul>
        </ctx>
      </ctx>
    </ctx>
  </body>
</html>
